modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional: load after the Orbital Railgun so this mod's recipe for it (Orbital age) replaces its own.
[[dependencies.${mod_id}]]
modId="orbital_railgun"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# Mixins (kept few and small): turned gravity for Magnetic Boots (space/gravity).
[[mixins]]
config="${mod_id}.mixins.json"
